[project]
name = "makeiteasy"
version = "0.1.0"
description = "Cheapest Makeup Finder MVP backend"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
